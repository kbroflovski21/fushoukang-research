<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金色年华 · 面向医保局的方案与演示</title>
<style>
  :root {
    --bg: #fafaf9; --card: #ffffff; --text: #1c1917; --muted: #78716c;
    --accent: #0f766e; --accent-light: #ccfbf1; --border: #e7e5e4;
    --green: #16a34a; --green-bg: #f0fdf4;
    --yellow: #ca8a04; --yellow-bg: #fefce8;
    --red: #dc2626; --red-bg: #fef2f2;
    --blue: #2563eb; --blue-bg: #eff6ff;
  }
  html { scroll-behavior: smooth; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.75; font-size: 17px;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 40px 32px 80px; }
  .back-link { font-size: 14px; color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 24px; }
  .back-link:hover { color: var(--accent); }

  .report-header {
    text-align: center; padding: 40px 0 32px;
    border-bottom: 1px solid var(--border); margin-bottom: 40px;
  }
  .report-header h1 { font-size: 30px; font-weight: 700; margin-bottom: 8px; }
  .report-header .subtitle { font-size: 17px; color: var(--muted); }
  .report-header .meta { margin-top: 12px; font-size: 13px; color: var(--muted); }

  .section { margin-bottom: 56px; }
  .section-number {
    display: inline-block; width: 28px; height: 28px; line-height: 28px;
    text-align: center; background: var(--accent); color: white;
    border-radius: 50%; font-size: 13px; font-weight: 700; margin-right: 10px; vertical-align: middle;
  }
  .section h2 { font-size: 22px; font-weight: 700; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 2px solid var(--accent); }
  .section h3 { font-size: 18px; font-weight: 700; margin: 28px 0 10px; }
  .section h4 { font-size: 15px; font-weight: 700; margin: 18px 0 6px; color: var(--muted); }
  .section p { margin-bottom: 12px; color: #44403c; }

  table { width: 100%; border-collapse: collapse; margin: 16px 0 24px; font-size: 15.5px; }
  thead th {
    background: #f5f5f4; padding: 10px 14px; text-align: left; font-weight: 600;
    font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px;
    border-bottom: 2px solid var(--border);
  }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }

  .callout {
    border-left: 3px solid var(--accent); background: var(--accent-light);
    padding: 18px 22px; margin: 20px 0; border-radius: 0 6px 6px 0; font-size: 15.5px;
  }
  .callout.gov { border-left-color: var(--red); background: var(--red-bg); }
  .callout.demo { border-left-color: var(--blue); background: var(--blue-bg); }
  .callout strong { font-weight: 700; }

  .hero-keyword {
    display: block; font-size: 28px; font-weight: 800; color: var(--red);
    margin: 16px 0 8px; line-height: 1.3;
  }
  .hero-keyword-sm {
    display: block; font-size: 22px; font-weight: 800; color: var(--red);
    margin: 12px 0 6px; line-height: 1.3;
  }
  .hero-keyword-xs {
    display: inline; font-size: 17px; font-weight: 800; color: var(--red);
  }

  .compare-block {
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 16px 0 24px;
  }
  .compare-header {
    padding: 10px 16px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .compare-header.others { background: #f5f5f4; color: var(--muted); }
  .compare-header.gy { background: var(--accent-light); color: var(--accent); }
  .compare-row {
    display: grid; grid-template-columns: 140px 1fr; border-bottom: 1px solid var(--border);
  }
  .compare-row:last-child { border-bottom: none; }
  .compare-label {
    padding: 10px 14px; font-weight: 600; font-size: 14px;
    border-right: 1px solid var(--border); background: #fafaf9;
  }
  .compare-value { padding: 10px 14px; font-size: 15px; color: #44403c; }

  .placeholder {
    padding: 40px; text-align: center; color: var(--muted); font-size: 16px;
    border: 2px dashed var(--border); border-radius: 8px; margin: 20px 0;
  }

  @media (max-width: 640px) {
    .hero-keyword { font-size: 24px; }
    .hero-keyword-sm { font-size: 19px; }
    .compare-row { grid-template-columns: 1fr; }
    .compare-label { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="container">

  <a href="goldenyears-narrative.html" class="back-link">&larr; 返回叙事总览</a>

  <div class="report-header">
    <h1>金色年华 · 面向医保局的方案与演示</h1>
    <div class="subtitle">基于金色年华实地调研与医保局需求，定制化方案</div>
    <div class="meta">2026年6月 · 演示准备文档 v2</div>
  </div>

  <div class="placeholder">等待输入：mexy 将基于金色年华实地调研的新信息和调整方向，逐步搭建本页内容。</div>

</div>
</body>
</html>
